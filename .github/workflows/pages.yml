# Builds the game and the map editor and publishes them on GitHub Pages:
#   https://<user>.github.io/<repo>/            the game
#   https://<user>.github.io/<repo>/editor.html  the map editor
# Runs on every push to main (and by hand from the Actions tab).
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx vite build
      # Which commit the site was built from (the online editor's Push / Pull start from it).
      - run: echo "{\"commit\":\"$GITHUB_SHA\"}" > dist/data/build.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
