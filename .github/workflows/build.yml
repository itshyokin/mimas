name: Build ROM

# Exports the project's map to GBA data, builds the Butano runtime and
# publishes the ROM, so the newest build is always at:
#   https://github.com/itshyokin/mimas/releases/latest/download/Mimas.gba
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        run: |
          apt-get update -q
          apt-get install -y -q python3 python3-pil

      - name: Get Butano
        run: git clone --depth 1 --branch 21.9.0 https://github.com/GValiente/butano.git butano

      - name: Export the map
        run: python3 tools/export.py

      - name: Build
        run: |
          make -C game -j"$(nproc)"
          cp game/mimas.gba Mimas.gba
          cp build/preview.png map-preview.png

      - name: Keep the ROM with this run
        uses: actions/upload-artifact@v4
        with:
          name: Mimas
          path: |
            Mimas.gba
            map-preview.png

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mimas build ${{ github.run_number }}
          body: "Built from ${{ github.sha }}. Download Mimas.gba and open it in Kestrel."
          files: |
            Mimas.gba
            map-preview.png
          make_latest: true
